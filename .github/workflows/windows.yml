name: Windows desktop
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
      - run: npm ci
      - run: npm run prepare:runtime
      - run: npm test
      - run: npm run smoke
      - run: node scripts/integration-smoke.cjs --offline
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-installer
          path: release/*Setup.exe
